# Workflow for code checks
name: Check code

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: yarn
      - run: yarn install --frozen-lockfile --ignore-scripts
      - run: yarn changelog:check
      - run: bash scripts/lint.sh
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: yarn
      # postinstall runs electron-rebuild; test:node runs under Electron's Node
      # (ELECTRON_RUN_AS_NODE) and needs both the Electron binary and a
      # better-sqlite3 built against it.
      - run: yarn install --frozen-lockfile
      - name: Run tests
        run: yarn test
