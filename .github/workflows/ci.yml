# Workflow for code checks
name: Check code

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: yarn
      - run: yarn install --frozen-lockfile --ignore-scripts
      - run: bash scripts/lint.sh
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: yarn
      # postinstall runs electron-rebuild; test:node runs under Electron's Node
      # (ELECTRON_RUN_AS_NODE) and needs both the Electron binary and a
      # better-sqlite3 built against it.
      - run: yarn install --frozen-lockfile
      - name: Run tests
        run: yarn test
